# Бесплатная выкладка Android-приложения Claude (PWA) на GitHub Pages.
# Адрес: https://penya4-droid.github.io/BMW-I-Bus-Sam/
# Один раз включите: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Claude для Android на GitHub Pages

on:
  push:
    branches: [main]
    paths: ["claude-android/app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Упаковать приложение
        uses: actions/upload-pages-artifact@v3
        with:
          path: claude-android/app

      - name: Выложить
        id: deployment
        uses: actions/deploy-pages@v4
